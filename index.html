<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="128x128" href="images/favicon.png">

    <title>ΔΗΜ.Ω.Σ ΓΕΛ Ρόδου</title>
 

    <style>
        :root {
            --primary: #1e5b8f;
            --primary-dark: #17476f;
            --background: #f4f6f8;
            --text: #27323b;
            --muted: #64748b;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #17476f, #2473ad);
            color: white;
            padding: 10px 20px;
        }

        .header-content {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 76px;
            padding: 8px 0 8px calc(clamp(120px, 25vw, 360px) + clamp(16px, 3vw, 48px));
            max-width: 1600px;
            margin: 0 auto;
        }

        .school-logo {
            display: block;
            position: absolute;
            top: 50%;
            left: 0;
            width: clamp(120px, 25vw, 360px);
            height: clamp(120px, 25vw, 360px);
            object-fit: contain;
            transform: translateY(-50%);
        }

        .header-text {
            flex: 1;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 2.3rem;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.05rem;
        }


        /* PAGE */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }


        /* DAY FILTER */

        .filters {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-label {
            color: var(--muted);
            font-weight: bold;
        }

        .day-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .day-button {
            border: 0;
            background: white;
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);

            transition: 0.2s;
        }

        .day-button:hover {
            transform: translateY(-2px);
        }

        .day-button.active {
            background: var(--primary);
            color: white;
        }


         /* CARDS */

        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .club-card {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .club-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.13);
        }

        .club-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .club-content {
            padding: 20px;
        }

        .club-content h2 {
            margin: 0 0 12px;
            font-size: 1.35rem;
            color: var(--primary-dark);
        }

        .club-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .label {
            background: #eaf2f8;
            color: var(--primary-dark);
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .club-description {
            color: #53616c;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .more {
            color: var(--primary);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .modal.open {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 750px;

            margin: 40px auto;
            border-radius: 15px;
            overflow: hidden;

            position: relative;

            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .modal-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-body h2 {
            margin-top: 0;
            color: var(--primary-dark);
            font-size: 1.8rem;
        }

        .modal-description {
            line-height: 1.7;
            margin-top: 20px;
            white-space: pre-line;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background: rgba(0,0,0,0.65);
            color: white;

            font-size: 22px;
            cursor: pointer;
        }
       
         /* VIDEO */

        .modal-video {
            margin-top: 25px;
        }

        .modal-video video {
            width: 100%;
            border-radius: 10px;
            background: black;
        }

        /* LOADING */

        #status {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 18px 12px;
            }

            .header-content {
                min-height: 0;
                padding: 0;
                gap: 12px;
            }

            .school-logo {
                position: static;
                flex: 0 0 clamp(72px, 20vw, 110px);
                width: clamp(72px, 20vw, 110px);
                height: clamp(72px, 20vw, 110px);
                transform: none;
            }

            .header-text {
                text-align: center;
            }

            .header-text h1 {
                font-size: 1.4rem;
            }

            .header-text p {
                font-size: 0.9rem;
            }

            .container {
                padding: 20px 15px 40px;
            }

            .clubs-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 10px;
            }

            .modal-content {
                margin: 15px auto;
            }

            .modal-body {
                padding: 20px;
            }
        }
    </style>
    </head>

    <body>

<header>
    <div class="header-content">
        <img class="school-logo" src="images/schoollogo.png" alt="Λογότυπο σχολείου">
        <div class="header-text">
            <!-- <h1>Δημόσιο Ωνάσειο Λύκειο Ρόδου</h1> -->
            <h1>Όμιλοι και Δραστηριότητες</h1>
            <p>Ανακαλύψτε τους ομίλους και τις δραστηριότητες του σχολείου μας</p>
        </div>
    </div>
</header>


<main class="container">

    <div class="filters">
        <div class="filter-group">
            <span class="filter-label">Ημέρα:</span>
            <div id="dayFilter" class="day-filter"></div>
        </div>
        <div class="filter-group">
            <span class="filter-label">Τάξη:</span>
            <div id="classFilter" class="day-filter"></div>
        </div>
    </div>

    <div id="status">
        Φόρτωση ομίλων...
    </div>

    <div id="clubsGrid" class="clubs-grid"></div>

</main>

<!-- DETAILS MODAL -->

<div id="clubModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeModal()">
            &times;
        </button>

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
        >

        <div class="modal-body">

            <h2 id="modalTitle"></h2>

            <div class="club-info">
                <span id="modalTeacher" class="label"></span>
                <span id="modalDay" class="label"></span>
                <span id="modalClasses" class="label" style="display: none"></span>
            </div>

            <div
                id="modalDescription"
                class="modal-description">
            </div>

            <div
                id="modalVideo"
                class="modal-video">
            </div>

        </div>

    </div>

</div>

<script>

let clubs = [];
let activeDay = "Όλοι";
let activeClass = "Όλες";


/*
 --------------------------------------------------
 CSV PARSER
 --------------------------------------------------

 This small parser supports quoted CSV values,
 including commas inside quotes.

 Example:

 "This description, contains a comma"

 --------------------------------------------------
*/

function parseCSV(text) {

    const rows = [];
    let row = [];
    let field = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {

            if (insideQuotes && nextChar === '"') {
                field += '"';
                i++;
            }
            else {
                insideQuotes = !insideQuotes;
            }

        }
        else if (char === ',' && !insideQuotes) {

            row.push(field.trim());
            field = "";

        }
        else if (
            (char === '\n' || char === '\r') &&
            !insideQuotes
        ) {

            if (char === '\r' && nextChar === '\n') {
                i++;
            }

            row.push(field.trim());
            field = "";

            if (row.some(value => value !== "")) {
                rows.push(row);
            }

            row = [];

        }
        else {

            field += char;

        }
    }
        if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        rows.push(row);
    }

    const headers = rows.shift();

    return rows.map(row => {

        const obj = {};

        headers.forEach((header, index) => {
            obj[header.trim()] = row[index] || "";
        });

        return obj;

    });

}

/*
 --------------------------------------------------
 LOAD CLUBS
 --------------------------------------------------
*/

async function loadClubs() {

    try {

        const response = await fetch("clubs.json");
        
        if (!response.ok) {
            throw new Error("Could not load clubs.csv");
        }
        clubs = await response.json();

        document.getElementById("status").style.display = "none";

        createDayFilters();
        createClassFilters();
        displayClubs();

    }
    catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "Δεν ήταν δυνατή η φόρτωση των ομίλων.";

    }

}

/*
 --------------------------------------------------
 DAY FILTERS
 --------------------------------------------------
*/

function createDayFilters() {

    const preferredOrder = [
        "Δευτέρα",
        "Τρίτη",
        "Τετάρτη",
        "Πέμπτη",
        "Παρασκευή"
    ];

    const availableDays =
    [...new Set(clubs.flatMap(club => club.days))];

    const days = preferredOrder.filter(
        day => availableDays.includes(day)
    );

    // Also include unexpected values
    availableDays.forEach(day => {
        if (!days.includes(day)) {
            days.push(day);
        }
    });

    const filter = document.getElementById("dayFilter");

    filter.innerHTML = "";

    createFilterButton("Όλοι", activeDay, filter, value => {
        activeDay = value;
    });

    days.forEach(day => {
        createFilterButton(day, activeDay, filter, value => {
            activeDay = value;
        });
    });

}

function createClassFilters() {

    const availableClasses = [
        ...new Set(clubs.flatMap(club =>
            Array.isArray(club.classes) ? club.classes : []
        ))
    ];

    const filter = document.getElementById("classFilter");

    filter.innerHTML = "";

    createFilterButton("Όλες", activeClass, filter, value => {
        activeClass = value;
    });

    availableClasses.forEach(className => {
        createFilterButton(className, activeClass, filter, value => {
            activeClass = value;
        });
    });

}

function createFilterButton(value, activeValue, container, onSelect) {

    const button = document.createElement("button");

    button.textContent = value;
    button.className = "day-button";

    if (value === activeValue) {
        button.classList.add("active");
    }

    button.addEventListener("click", () => {

        onSelect(value);

        container
            .querySelectorAll(".day-button")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        displayClubs();

    });

    container.appendChild(button);

}


/*
 --------------------------------------------------
 DISPLAY CARDS
 --------------------------------------------------
*/

function displayClubs() {

    const grid = document.getElementById("clubsGrid");

    grid.innerHTML = "";

    const filteredClubs = clubs.filter(club =>
        (activeDay === "Όλοι" || club.days.includes(activeDay)) &&
        (activeClass === "Όλες" ||
            (Array.isArray(club.classes) && club.classes.includes(activeClass)))
    );


    filteredClubs.forEach(club => {

        const card = document.createElement("article");

        card.className = "club-card";


        /*
         IMAGE
        */

        if (club.image) {

            const image = document.createElement("img");

            image.src = club.image;
            image.alt = club.title;
            image.className = "club-image";

            card.appendChild(image);

        }


        /*
         CARD CONTENT
        */

        const content = document.createElement("div");

        content.className = "club-content";


        const title = document.createElement("h2");
        title.textContent = club.title;


        const info = document.createElement("div");
        info.className = "club-info";


        const teacher = document.createElement("span");
        teacher.className = "label";
        teacher.textContent = "👤 " + club.teacher;


        const day = document.createElement("span");
        day.className = "label";
        day.textContent = "📅 " + club.days.join(" & ");


        info.appendChild(teacher);
        info.appendChild(day);

        if (Array.isArray(club.classes) && club.classes.length > 0) {
            const classes = document.createElement("span");
            classes.className = "label";
            classes.textContent = "🎓 " + club.classes.join(" & ");
            info.appendChild(classes);
        }


        const description = document.createElement("div");

        description.className = "club-description";
        description.textContent = club.shortDescription;


        const more = document.createElement("div");

        more.className = "more";
        more.textContent = "Περισσότερα →";


        content.appendChild(title);
        content.appendChild(info);
        content.appendChild(description);
        content.appendChild(more);

        card.appendChild(content);

                card.addEventListener("click", () => {
            openModal(club);
        });


        grid.appendChild(card);

    });

}

/*
 --------------------------------------------------
 MODAL
 --------------------------------------------------
*/

function openModal(club) {

    const modal = document.getElementById("clubModal");

    const modalImage =
        document.getElementById("modalImage");


    document.getElementById("modalTitle")
        .textContent = club.title;

    document.getElementById("modalTeacher")
        .textContent = "👤 " + club.teacher;

    document.getElementById("modalDay")
    .textContent = "📅 " + club.days.join(" & ");

    const modalClasses = document.getElementById("modalClasses");
    if (Array.isArray(club.classes) && club.classes.length > 0) {
        modalClasses.textContent = "🎓 " + club.classes.join(" & ");
        modalClasses.style.display = "";
    }
    else {
        modalClasses.style.display = "none";
    }

    document.getElementById("modalDescription")
        .textContent = club.description;

   /*
     IMAGE
    */

    if (club.image) {

        modalImage.src = club.image;
        modalImage.alt = club.title;
        modalImage.style.display = "block";

    }
    else {

        modalImage.style.display = "none";

    }

     /*
     VIDEO
    */

    const videoContainer =
        document.getElementById("modalVideo");

    videoContainer.innerHTML = "";


    if (club.video) {

        const video = document.createElement("video");

        video.src = club.video;
        video.controls = true;
        video.preload = "metadata";

        videoContainer.appendChild(video);

    }


    modal.classList.add("open");

    document.body.style.overflow = "hidden";

}/*
 --------------------------------------------------
 CLOSE MODAL
 --------------------------------------------------
*/

function closeModal() {

    const modal =
        document.getElementById("clubModal");

    modal.classList.remove("open");

    document.body.style.overflow = "";


    // Stop video when modal closes

    const video = modal.querySelector("video");

    if (video) {
        video.pause();
    }

}


/*
 Close when user clicks outside the box
*/

document
    .getElementById("clubModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }

    });


/*
 Close with Escape
*/

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeModal();
    }

});


/*
 Start
*/

loadClubs();

</script>

</body>
</html>
