      <stop offset="1" stop-color="#155b69"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#66e3d4"/>
      <stop offset="1" stop-color="#8cceff"/>
    </linearGradient>
    <marker id="measure" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M7 0 0 3.5 7 7" fill="none" stroke="#ffda78" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="600" height="360" rx="28" fill="url(#background)"/>
