  <text x="54" y="102" fill="#d9edf5" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">ΤΑΛΑΝΤΩΣΗ ΕΛΑΤΗΡΙΟΥ</text>
