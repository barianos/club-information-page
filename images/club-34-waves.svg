<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Κύματα και ταλαντώσεις στη Φυσική</title>
  <desc id="desc">Ένα ελατήριο με ταλαντούμενο σώμα και ένα εγκάρσιο κύμα με σημειωμένο μήκος κύματος και πλάτος.</desc>
  <defs>
